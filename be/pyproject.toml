[project]
name = "task-plan-server"
version = "0.1.0"
description = "FastAPI / SQLAlchemy 2.0 / Postgres Hexagonal multi-package backend"
requires-python = ">=3.12"
dependencies = [
    "task-plan-server-app",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
"task-plan-server-model" = { workspace = true }
"task-plan-server-exception" = { workspace = true }
"task-plan-server-transaction" = { workspace = true }
"task-plan-server-my-logging" = { workspace = true }
"task-plan-server-infrastructure" = { workspace = true }
"task-plan-server-persistence" = { workspace = true }
"task-plan-server-service" = { workspace = true }
"task-plan-server-api" = { workspace = true }
"task-plan-server-schema" = { workspace = true }
"task-plan-server-app" = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "import-linter>=2.1",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["task_plan_server"]

[tool.mypy]
python_version = "3.12"
files = ["packages/*/src"]
mypy_path = "packages/model/src:packages/exception/src:packages/transaction/src:packages/my_logging/src:packages/infrastructure/src:packages/persistence/src:packages/service/src:packages/api/src:packages/schema/src:packages/app/src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.importlinter]
root_package = "task_plan_server"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "hexagonal layers"
type = "layers"
layers = [
    "task_plan_server.app",
    "task_plan_server.schema",
    "task_plan_server.api | task_plan_server.persistence",
    "task_plan_server.service",
    "task_plan_server.infrastructure",
    "task_plan_server.model | task_plan_server.exception | task_plan_server.transaction | task_plan_server.my_logging",
]

[[tool.importlinter.contracts]]
name = "no db libraries outside persistence / schema / app"
type = "forbidden"
source_modules = [
    "task_plan_server.model",
    "task_plan_server.exception",
    "task_plan_server.transaction",
    "task_plan_server.my_logging",
    "task_plan_server.infrastructure",
    "task_plan_server.service",
    "task_plan_server.api",
]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic"]
