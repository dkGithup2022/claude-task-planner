[project]
name = "task-plan-server-schema"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["task-plan-server-persistence", "alembic>=1.13", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling>=1.25"]
