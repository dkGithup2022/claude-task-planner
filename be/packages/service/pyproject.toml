[project]
name = "task-plan-server-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["task-plan-server-infrastructure", "task-plan-server-transaction", "task-plan-server-my-logging", "task-plan-server-model", "task-plan-server-exception"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_plan_server"]
