[project]
name = "task-plan-server-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["task-plan-server-service", "task-plan-server-my-logging", "task-plan-server-model", "task-plan-server-exception", "fastapi>=0.115", "pydantic>=2.9", "dishka>=1.4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_plan_server"]
